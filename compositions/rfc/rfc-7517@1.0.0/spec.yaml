# spec.yaml — structured extract of RFC 7517 for AI/application consumption
# atom: schema-atoms/rfc/rfc-7517@1.0.0

rfc_number: 7517
title: "JSON Web Key (JWK)"
status: STANDARDS_TRACK
published_date: "2015-05"
authors:
  - "M. Jones"
suite: JOSE

jwk_required_fields:
  - kty: "Key Type — identifies the cryptographic algorithm family"

jwk_common_parameters:
  kty: {required: true, description: "Key type (RSA, EC, oct)"}
  use: {required: false, description: "Intended use: sig or enc"}
  key_ops: {required: false, description: "Key operations array"}
  alg: {required: false, description: "Algorithm (see RFC 7518)"}
  kid: {required: false, description: "Key ID — unique identifier"}

key_types:
  RSA:
    public: ["n", "e"]
    private: ["d", "p", "q", "dp", "dq", "qi"]
  EC:
    curves: ["P-256", "P-384", "P-521"]
    public: ["crv", "x", "y"]
    private: ["d"]
  oct:
    symmetric: ["k"]

encoding: "Base64url (RFC 4648 §5, no padding)"

jwk_set:
  structure: '{"keys": [<JWK>, ...]}'
  note: "kid SHOULD be unique within a JWK Set"

normative_requirements:
  - "kty parameter MUST be present in every JWK"
  - "Members used to represent key parameters MUST be unique"
  - "kid values SHOULD be distinct when present in a JWK Set"

references:
  - rfc: 7518
    relationship: see_also
  - rfc: 7515
    relationship: see_also
  - rfc: 7516
    relationship: see_also
