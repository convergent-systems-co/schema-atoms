# ATOMS.yml — catalog manifest for schema-atoms
#
# Conforms to: https://github.com/convergent-systems-co/atoms/blob/main/specs/atom-schema-spec-v1.0.0-draft.md
# Parts II and VII

spec_version: atoms-spec/v1.1.0
name: schema-atoms
version: 1.0.0-draft
canonical_domain: schema-atoms.com
federation: convergent-systems.co

atom_types:
  # Family: design-spec
  - design-spec
  # Family: api-spec
  - openapi-spec
  - asyncapi-spec
  - graphql-schema
  - grpc-spec
  - json-rpc-spec
  # Family: data-schema
  - json-schema
  - protobuf-schema
  - avro-schema
  - xml-schema
  - toml-schema
  # Family: protocol-spec
  - rfc
  - w3c-spec
  - iso-spec
  - fips
  - internal-protocol
  # Family: language-spec
  - bnf-grammar
  - ebnf-grammar
  - language-reference
  - query-language-spec
  - regex-spec
  # Family: taxonomy-spec
  - ontology
  - controlled-vocabulary
  - code-list
  # Family: grammar (structural contracts for atom classes in other catalogs)
  - skill
  - hook

composition_type: spec-compositions
composition_dir: compositions/

signing:
  required_algorithms: ["ml-dsa-65"]
  accepted_algorithms: ["ml-dsa-65", "ml-dsa-44", "ml-dsa-87"]
  quorum_rules:
    default: "1 of role:catalog-maintainer"
    design-spec: "1 of role:catalog-maintainer + 1 of role:editor"
    "governance/*": "1 of role:catalog-maintainer + 1 of role:ratifier"
    rfc: "1 of role:catalog-maintainer"
    w3c-spec: "1 of role:catalog-maintainer"
    iso-spec: "1 of role:catalog-maintainer"
    fips: "1 of role:catalog-maintainer"

lifecycle:
  current: draft

licensing:
  code: Apache-2.0
  data: CC-BY-4.0
  # Note: imported protocol-specs retain their upstream license.
  # CC-BY-4.0 applies to Convergent Systems-authored atom content only.
  # Each imported atom's protocol.provenance block records the upstream license.

steward: convergent-systems-co
infrastructure_operator: convergent-systems-co

runtime_consumers:
  - ai-constitution
  - olympus
  - atoms-tools
